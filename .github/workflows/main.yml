name: Delivery checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  delivery-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt ruff==0.17.6
          npm ci
          npx playwright install --with-deps chromium

      - name: Run delivery checks
        run: python tests/check_delivery.py
