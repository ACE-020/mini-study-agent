name: Delivery checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  delivery-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Check Python with Ruff
        run: |
          python -m pip install ruff==0.17.6
          python -m ruff check --select F821,F822,F823 .

      - name: Run math input regression tests
        run: node tests/test_math_input.js
