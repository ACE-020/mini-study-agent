# 学习整理助手 · 小程序 API 反向代理
#
# 微信要求：HTTPS、443 端口、已备案域名、TLS 1.2+、证书链完整。
# 把 study.example.com 换成你自己的域名，证书路径换成实际路径。

server {
    listen 80;
    server_name study.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name study.example.com;

    ssl_certificate     /etc/nginx/ssl/study.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/study.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # 图片/PDF 上传：单张 8MB、整批 512MB
    client_max_body_size 520m;
    client_body_timeout  120s;

    # 只暴露 API 与健康检查，网页版页面不用在这里开
    location /api/ {
        proxy_pass         http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 对话是“提交任务 + 轮询”，单次请求都很短；
        # 这里放宽只是给大文件上传留余量。
        proxy_connect_timeout 10s;
        proxy_send_timeout    130s;
        proxy_read_timeout    130s;
        proxy_buffering       off;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8766;
        access_log off;
    }

    location / {
        return 404;
    }
}
